name: build

# 手動実行 (workflow_dispatch) か v* タグで、Win/Mac/Linux を自動ビルドする。
# 署名は secrets を入れたときだけ有効になる (未設定なら署名なしビルド)。
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      - name: Build (electron-builder)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            npx electron-builder --mac dmg zip --arm64 --x64 --publish never
          else
            npx electron-builder --publish never
          fi
        env:
          # 署名なしビルドを明示 (証明書を secrets に入れる段階で署名設定に差し替える)
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: mokobura-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.tar.gz
          if-no-files-found: ignore
